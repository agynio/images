version: v2beta1

vars:
  IMAGES_NAMESPACE: platform
  DEV_IMAGE: ghcr.io/agynio/devcontainer-go:1

functions:
  patch_deployment: |-
    echo "Patching images deployment for DevSpace..."
    kubectl patch deployment images -n ${IMAGES_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: images
              image: ghcr.io/agynio/devcontainer-go:1 # keep in sync with DEV_IMAGE
              workingDir: /opt/app/data
              livenessProbe: null
              readinessProbe: null
              startupProbe: null
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "Images DevSpace container ready."
                  tail -f /dev/null
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              resources:
                # Requests are reservations held for the pod's whole life, but a
                # dev container only needs its build peak briefly and then idles
                # near 100Mi. Keeping them low lets several services run from
                # source on one node; the limits still allow a full build.
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace images
      else
        start_dev --disable-pod-replace images
        echo "Starting images service from synced source..."
        exec_container --label-selector=app.kubernetes.io/name=images -n ${IMAGES_NAMESPACE} -- bash -lc 'set -euo pipefail
          cd /opt/app/data
          elapsed=0
          while [ ! -f go.mod ]; do
            sleep 1; elapsed=$((elapsed + 1))
            [ "$elapsed" -ge 300 ] && { echo "ERROR: sync timeout" >&2; exit 1; }
          done
          buf generate
          nohup go run ./cmd/images-service >/tmp/images-service.log 2>&1 &
        '
        echo "Waiting for images to be healthy on :50051..."
        healthy=false
        for i in $(seq 1 60); do
          if exec_container --label-selector=app.kubernetes.io/name=images -n ${IMAGES_NAMESPACE} -- bash -c 'nc -z localhost 50051 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/50051) >/dev/null 2>&1'; then
            healthy=true
            break
          fi
          sleep 2
        done
        if [ "$healthy" != "true" ]; then
          echo "ERROR: Images did not become healthy within 120s" >&2
          exit 1
        fi
        echo "Dev environment ready. Stopping dev session."
        stop_dev images
      fi

hooks:

dev:
  images:
    namespace: ${IMAGES_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: images
    containers:
      images:
        container: images
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /gen/
              - /tmp/
        logs:
          enabled: true
          lastLines: 200
