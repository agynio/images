replicaCount: 1

image:
  repository: ghcr.io/agynio/images
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "images"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 50051

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

database:
  # Plaintext database URL. Leave empty when using an existing secret.
  url: ""
  existingSecret:
    # Secret containing the database URL. Leave empty when using `database.url`.
    name: agyn-platform-database-urls
    # Key within the secret that stores the connection string.
    key: images

authorization:
  grpcTarget: "authorization:50051"

secretsService:
  grpcTarget: "secrets:50051"

notifications:
  # Optional. Without it the service runs and simply publishes nothing, so
  # Console lists refresh on open rather than reactively.
  grpcTarget: "notifications:50051"

discovery:
  # How often each image's repository is polled. RefreshImage covers the
  # latency this would otherwise add.
  interval: 15m
  timeout: 60s

# ResolveVersion carries no user identity - it is restricted by reachability
# rather than by a permission check. Without this
# policy any workload in the mesh could read every registry credential the
# platform holds.
internalAuthorizationPolicy:
  enabled: true
  # Service accounts allowed to resolve an image to its upstream credential.
  resolveVersionServiceAccounts:
    - name: image-proxy
      namespace: ""
    - name: agents
      namespace: ""
  # Service accounts allowed to ask which images hold a secret by reference.
  countReferencesServiceAccounts:
    - name: secrets
      namespace: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
