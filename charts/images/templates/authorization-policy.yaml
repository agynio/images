{{- if .Values.internalAuthorizationPolicy.enabled }}
{{- $namespace := .Release.Namespace }}
# ResolveVersion hands back the registry credential an image names, and
# CountImagesReferencingSecret answers the Secrets service before a delete.
# Neither carries an identity a permission check could refuse, so who may reach
# them at all is settled here.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-resolve-version
  labels:
    app.kubernetes.io/name: {{ include "images.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "images.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
{{- include "images.principals" (dict "accounts" .Values.internalAuthorizationPolicy.resolveVersionServiceAccounts "namespace" $namespace) | trim | nindent 14 }}
      to:
        - operation:
            methods:
              - POST
            paths:
              - /agynio.api.images.v1.ImagesService/ResolveVersion
              - /agynio.api.images.v1.ImagesService/ResolveImage
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-count-images-referencing-secret
  labels:
    app.kubernetes.io/name: {{ include "images.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "images.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
{{- include "images.principals" (dict "accounts" .Values.internalAuthorizationPolicy.countReferencesServiceAccounts "namespace" $namespace) | trim | nindent 14 }}
      to:
        - operation:
            methods:
              - POST
            paths:
              - /agynio.api.images.v1.ImagesService/CountImagesReferencingSecret
{{- end }}
