{{- if .Values.provisioning.enabled }}
{{- $name := printf "%s-provisioner" (include "images.fullname" .) }}
# The resources a freshly installed platform needs before anyone can use it.
# Rendered as a Helm hook so it runs on every install and every upgrade: the
# calls are create-if-absent, so re-running changes nothing and an operator's
# edit survives.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "images.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  provision.json: |
{{ dict "organization" .Values.provisioning.organization "images" .Values.provisioning.images | toPrettyJson | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.provisioning.serviceAccountName }}
  labels:
    app.kubernetes.io/name: {{ include "images.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    # Kept between upgrades: the Istio policies that name this principal are
    # not hooks, so deleting it would leave them naming nothing.
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "images.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: {{ .Values.provisioning.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "images.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: provisioner
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.provisioning.serviceAccountName }}
      containers:
        - name: provisioner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/provisioner"]
          env:
            - name: ORGANIZATIONS_GRPC_TARGET
              value: {{ required "provisioning.organizationsGrpcTarget must be set" .Values.provisioning.organizationsGrpcTarget | quote }}
            - name: IMAGES_GRPC_TARGET
              value: {{ printf "%s:%v" (include "images.fullname" .) .Values.service.port | quote }}
            - name: PROVISION_CONFIG
              value: /etc/agyn/provision/provision.json
          volumeMounts:
            - name: provision
              mountPath: /etc/agyn/provision
              readOnly: true
          {{- with .Values.provisioning.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
      volumes:
        - name: provision
          configMap:
            name: {{ $name }}
{{- end }}
