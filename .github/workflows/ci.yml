name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      # agynio/api/images/v1 is vendored under proto/ until it is published to
      # buf.build/agynio/api; see proto/buf.yaml.
      - name: Generate protobuf stubs
        run: buf generate

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...
