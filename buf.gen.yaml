version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/images/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  # Vendored until agynio/api/images/v1 is published; see proto/buf.yaml.
  - directory: proto
  - module: buf.build/agynio/api
    paths:
      - agynio/api/authorization/v1/authorization.proto
      - agynio/api/notifications/v1/notifications.proto
      - agynio/api/secrets/v1/secrets.proto
